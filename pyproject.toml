[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rw4t"
version = "0.1.0"
description = "rw4t"
authors = [{ name = "Bill Qian", email = "bill.qian@rice.edu" }]

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "torch==2.9.0",
    "torchvision==0.24.0",
    "torchaudio==2.9.0",
    "imitation"
]

[tool.setuptools.packages.find]
include = ["gym_envs*", "scripts*"]